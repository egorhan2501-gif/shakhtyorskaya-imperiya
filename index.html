<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>Шахтёрская Империя</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#090909;
 --panel:#151412;
 --panel2:#201d18;
 --gold:#c9a45c;
 --gold2:#f0d28d;
 --text:#eee8dc;
 --muted:#a49b8c;
 --line:#51432b;
 --green:#829d65;
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;min-height:100vh;
 overflow-x:hidden;
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#world{
 position:fixed;inset:0;z-index:-3;
 background:radial-gradient(ellipse at 50% 30%,#29251d 0%,#11100e 45%,#050505 100%);
 transition:background .8s;
}
#world:before{
 content:"";position:absolute;inset:0;
 background:
 radial-gradient(ellipse at 50% 90%,#49391d20,transparent 55%),
 repeating-linear-gradient(120deg,transparent 0 70px,#ffffff04 71px 72px);
}
#world:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,#00000035,#000000a8);
}
#world.ural{background:radial-gradient(ellipse at 50% 35%,#413322,#15120e 65%,#050505)}
#world.siberia{background:radial-gradient(ellipse at 50% 30%,#28333a,#101417 65%,#050505)}
#world.altai{background:radial-gradient(ellipse at 50% 30%,#40312d,#17110f 65%,#050505)}
#world.karelia{background:radial-gradient(ellipse at 50% 30%,#20342c,#0e1712 65%,#050505)}
#world.yakutia{background:radial-gradient(ellipse at 50% 30%,#333944,#101216 65%,#050505)}
#world.polar{background:radial-gradient(ellipse at 50% 30%,#242d3b,#0c1019 65%,#030407)}

/* ЭКРАН ЗАГРУЗКИ */
#splash{
 position:fixed;inset:0;z-index:1000;
 background:
 radial-gradient(ellipse at 50% 40%,#292216 0%,#0b0a08 48%,#000 100%);
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;padding:25px;
 transition:opacity .65s;
}
#splash.hide{opacity:0;pointer-events:none}
.eagle{
 width:220px;height:220px;
 filter:drop-shadow(0 0 20px #b28b45aa);
 animation:eagleGlow 3s ease-in-out infinite;
}
.eagle svg{width:100%;height:100%}
.splash-title{
 color:var(--gold2);font-size:25px;font-weight:900;
 letter-spacing:2px;margin-top:20px;
 text-shadow:0 2px 15px #c9a45c55;
}
.splash-sub{color:#a99b7c;font-size:12px;margin-top:10px}
.splash-line{
 width:230px;height:3px;background:#30291e;
 margin-top:32px;border-radius:5px;overflow:hidden;
}
.splash-line div{
 height:100%;width:0;background:var(--gold);
 animation:load 2.3s forwards;
}
#load-text{font-size:11px;color:#93856a;margin-top:12px}
@keyframes load{to{width:100%}}
@keyframes eagleGlow{50%{filter:drop-shadow(0 0 34px #d3a84d)}}

/* ОСНОВНОЙ ИНТЕРФЕЙС */
#app{max-width:650px;margin:auto;min-height:100vh;padding-bottom:92px}
.topbar{
 position:sticky;top:0;z-index:30;
 display:flex;justify-content:space-between;align-items:center;
 padding:13px 14px;background:#090909ed;
 border-bottom:1px solid var(--line);
 backdrop-filter:blur(12px);
}
.brand{font-size:14px;font-weight:900;letter-spacing:1px}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:normal;margin-top:4px}
.balance{
 color:var(--gold2);background:#241d12;
 border:1px solid #7d6235;border-radius:10px;
 padding:9px 12px;font-weight:bold;font-size:14px;
}
.content{padding:13px}
.panel{
 background:linear-gradient(145deg,#1b1915ed,#100f0ded);
 border:1px solid var(--line);border-radius:15px;
 padding:14px;margin-bottom:12px;
 box-shadow:0 8px 24px #0007;
}
.panel-title{font-weight:800;font-size:16px;margin-bottom:10px}
.muted{font-size:12px;color:var(--muted);line-height:1.5}
.small{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{
 background:#ffffff08;border:1px solid #ffffff12;
 border-radius:12px;padding:12px;
}
.stat span{font-size:11px;color:var(--muted)}
.stat strong{display:block;color:var(--gold2);font-size:19px;margin-top:5px}
.btn{
 width:100%;border:1px solid #9a7840;border-radius:10px;
 padding:12px;background:linear-gradient(135deg,#c8a25d,#86632e);
 color:#160f06;font-weight:900;
}
.btn.dark{background:#24211b;color:#e7d5ad;border-color:#51432b}
.btn.green{background:#26352a;color:#c5d8a5;border-color:#506d47}
.btn:active{transform:scale(.98)}
.mining{
 text-align:center;padding:20px 12px;
 background:radial-gradient(ellipse at center,#49361b55,#14110d);
 border:1px solid #65502c;border-radius:15px;
}
.mine-symbol{font-size:65px;display:block;margin-bottom:7px}
.mine-button{
 width:145px;height:145px;border-radius:50%;
 border:4px solid #c7a15b;
 background:radial-gradient(circle at 35% 25%,#79603b,#302316 65%,#100c08);
 color:#f0d28d;font-size:55px;
 box-shadow:0 0 30px #d0a24a30,inset 0 0 20px #000;
 margin:13px auto;
}
.mine-button:active{transform:scale(.93)}
.tabs{
 position:fixed;bottom:0;left:0;right:0;z-index:40;
 display:flex;justify-content:space-around;
 padding:8px 2px max(8px,env(safe-area-inset-bottom));
 background:#080807f5;border-top:1px solid var(--line);
 backdrop-filter:blur(15px);
}
.tab{
 flex:1;border:0;background:none;color:#887f70;
 font-size:10px;display:flex;flex-direction:column;
 align-items:center;gap:4px;
}
.tab b{font-size:21px}
.tab.active{color:var(--gold2)}
.card{
 background:#ffffff08;border:1px solid #ffffff13;
 border-radius:12px;padding:13px;margin-bottom:10px;
}
.badge{
 font-size:10px;color:var(--gold2);
 background:#80612d30;border:1px solid #80612d;
 border-radius:7px;padding:4px 7px;
}
.resource{
 display:flex;align-items:center;justify-content:space-between;
 padding:11px 0;border-bottom:1px solid #ffffff12;
}
.resource:last-child{border:0}
.resource-left{display:flex;align-items:center;gap:10px}
.resource-icon{font-size:25px}
.resource-name{font-weight:bold;font-size:13px}
.progress{height:7px;background:#ffffff17;border-radius:9px;overflow:hidden;margin:9px 0}
.progress div{height:100%;background:linear-gradient(90deg,#a47b3d,#f0d28d)}
.toast{
 position:fixed;top:75px;left:50%;z-index:100;
 transform:translate(-50%,-15px);opacity:0;
 background:#211c13;border:1px solid #a18148;
 border-radius:11px;padding:12px 17px;
 max-width:90%;text-align:center;font-size:13px;
 pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
input,select{
 background:#211e18;color:#eee;border:1px solid #51432b;
 padding:10px;border-radius:8px;
}
.empty{text-align:center;padding:25px;color:var(--muted)}
</style>
</head>

<body>

<div id="splash">
 <div class="eagle">
  <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#ffe6a5"/>
     <stop offset=".5" stop-color="#c59a4d"/>
     <stop offset="1" stop-color="#79531f"/>
    </linearGradient>
   </defs>
   <g fill="url(#gold)" stroke="#65451c" stroke-width="2">
    <path d="M120 48 L112 27 L120 9 L128 27 Z"/>
    <path d="M120 38 L83 21 L89 44 L104 53 Z"/>
    <path d="M120 38 L157 21 L151 44 L136 53 Z"/>
    <path d="M120 55 C92 32 64 38 20 67 C43 66 55 83 68 102 C43 95 27 107 9 126 C45 115 69 133 88 145 L108 120 L120 128 L132 120 L152 145 C171 133 195 115 231 126 C213 107 197 95 172 102 C185 83 197 66 220 67 C176 38 148 32 120 55Z"/>
    <path d="M120 52 C105 63 103 84 111 100 L120 112 L129 100 C137 84 135 63 120 52Z"/>
    <path d="M110 103 L120 121 L130 103 L137 134 L120 151 L103 134Z"/>
    <path d="M109 131 L120 149 L131 131 L128 172 L120 190 L112 172Z"/>
    <path d="M103 190 L120 181 L137 190 L132 197 L120 192 L108 197Z"/>
    <path d="M110 80 L99 72 L101 86 L111 92Z"/>
    <path d="M130 80 L141 72 L139 86 L129 92Z"/>
    <path d="M116 98 L120 105 L124 98 L120 94Z"/>
   </g>
   <g fill="none" stroke="#e5c77e" stroke-width="2">
    <path d="M24 69 Q59 47 96 91"/>
    <path d="M216 69 Q181 47 144 91"/>
    <path d="M39 110 Q66 102 90 128"/>
    <path d="M201 110 Q174 102 150 128"/>
   </g>
   <circle cx="120" cy="119" r="3" fill="#fff0c5"/>
   <path d="M111 157 L91 182 L102 184 L120 170 L138 184 L149 182 L129 157" fill="none" stroke="#e1bd6e" stroke-width="3"/>
  </svg>
 </div>
 <div class="splash-title">ШАХТЁРСКАЯ ИМПЕРИЯ</div>
 <div class="splash-sub">Честь · Труд · Богатство</div>
 <div class="splash-line"><div></div></div>
 <div id="load-text">Подготавливаем шахты...</div>
</div>

<div id="world" class="ural"></div>

<div id="app">
 <header class="topbar">
  <div class="brand">⚒ ШАХТЁРСКАЯ ИМПЕРИЯ
   <small id="level-label">Уровень 1 · Новичок</small>
  </div>
  <div class="balance">🪙 <span id="coins">500</span></div>
 </header>
 <main class="content" id="screen"></main>
</div>

<nav class="tabs">
 <button class="tab active" data-tab="mine"><b>⛏️</b>Шахта</button>
 <button class="tab" data-tab="mines"><b>🏔️</b>Месторождения</button>
 <button class="tab" data-tab="workers"><b>👷</b>Рабочие</button>
 <button class="tab" data-tab="market"><b>💰</b>Рынок</button>
 <button class="tab" data-tab="more"><b>☰</b>Меню</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";

const KEY="minerEmpire_v5";

const RES={
 iron:{name:"Железо",icon:"🪨",price:2},
 copper:{name:"Медь",icon:"🟠",price:4},
 silver:{name:"Серебро",icon:"🥈",price:10},
 gold:{name:"Золото",icon:"🥇",price:20},
 amethyst:{name:"Аметист",icon:"💜",price:35},
 emerald:{name:"Изумруд",icon:"💚",price:60},
 diamond:{name:"Алмаз",icon:"💎",price:120}
};

const MINES=[
 {id:"ural",name:"Уральская шахта",price:0,level:1,theme:"ural",resources:["iron","copper"],desc:"Старинные уральские рудники."},
 {id:"siberia",name:"Сибирские рудники",price:2500,level:3,theme:"siberia",resources:["copper","silver"],desc:"Богатые месторождения сурового края."},
 {id:"altai",name:"Алтайские месторождения",price:9000,level:5,theme:"altai",resources:["gold","amethyst"],desc:"Горные залежи золота и кристаллов."},
 {id:"karelia",name:"Карельские глубины",price:25000,level:8,theme:"karelia",resources:["silver","emerald"],desc:"Глубокие шахты среди северных лесов."},
 {id:"yakutia",name:"Якутские копи",price:65000,level:12,theme:"yakutia",resources:["gold","diamond"],desc:"Редкие минералы в суровом климате."},
 {id:"polar",name:"Заполярные шахты",price:150000,level:16,theme:"polar",resources:["amethyst","emerald","diamond"],desc:"Самые удалённые месторождения."}
];

const BUILDINGS={
 forge:{name:"Кузница",icon:"🔥",cost:1200,desc:"+5% ручной добычи за уровень"},
 treasury:{name:"Казначейство",icon:"🏦",cost:2000,desc:"+3% выручки от продажи за уровень"},
 lab:{name:"Лаборатория",icon:"🔬",cost:3000,desc:"+2% шанс бонусной руды за уровень"},
 library:{name:"Академия",icon:"📚",cost:1500,desc:"+5% опыта за уровень"},
 station:{name:"Вокзал",icon:"🚂",cost:2500,desc:"+5% наград экспедиции за уровень"}
};

const TASKS=[
 {id:"t1",name:"Начало пути",desc:"Добудь 20 руды",type:"mined",goal:20,reward:150},
 {id:"t2",name:"Старатель",desc:"Добудь 200 руды",type:"mined",goal:200,reward:500},
 {id:"t3",name:"Торговец",desc:"Продай 50 руды",type:"sold",goal:50,reward:250},
 {id:"t4",name:"Крупная сделка",desc:"Продай 500 руды",type:"sold",goal:500,reward:1000},
 {id:"t5",name:"Бригада",desc:"Найми 3 шахтёров",type:"miners",goal:3,reward:600},
 {id:"t6",name:"Начальник",desc:"Найми 8 шахтёров",type:"miners",goal:8,reward:1800},
 {id:"t7",name:"Новая кирка",desc:"Улучши кирку до 3 уровня",type:"pick",goal:3,reward:500},
 {id:"t8",name:"Расширение",desc:"Открой 2 шахты",type:"mines",goal:2,reward:700},
 {id:"t9",name:"Империя",desc:"Открой 4 шахты",type:"mines",goal:4,reward:2500},
 {id:"t10",name:"Строитель",desc:"Улучши здания 3 раза",type:"buildings",goal:3,reward:800},
 {id:"t11",name:"Золотая жила",desc:"Добудь 20 золота",type:"gold",goal:20,reward:700},
 {id:"t12",name:"Кристаллы",desc:"Добудь 20 аметистов",type:"amethyst",goal:20,reward:900},
 {id:"t13",name:"Алмазный запас",desc:"Добудь 5 алмазов",type:"diamond",goal:5,reward:1500},
 {id:"t14",name:"Репутация",desc:"Набери 100 репутации",type:"rep",goal:100,reward:1000},
 {id:"t15",name:"Путешественник",desc:"Заверши 2 экспедиции",type:"expeditions",goal:2,reward:1000},
 {id:"t16",name:"Опытный",desc:"Достигни 5 уровня",type:"level",goal:5,reward:900}
];

function fresh(){
 return {
  coins:500,xp:0,level:1,rep:0,
  ore:{iron:0,copper:0,silver:0,gold:0,amethyst:0,emerald:0,diamond:0},
  owned:["ural"],selected:"ural",
  miners:[],buildings:{forge:0,treasury:0,lab:0,library:0,station:0},
  pick:1,clicks:0,mined:0,sold:0,
  minedTypes:{gold:0,amethyst:0,diamond:0},
  buildingsBought:0,expeditions:0,expedition:null,
  claimed:[],lastTime:Date.now(),
  daily:"",streak:0,contractsDone:0,contract:null,
  chests:0,coinsEarned:0
 };
}

function normalize(s){
 const d=fresh();
 s={...d,...s};
 s.ore={...d.ore,...(s.ore||{})};
 s.buildings={...d.buildings,...(s.buildings||{})};
 s.minedTypes={...d.minedTypes,...(s.minedTypes||{})};
 s.owned=Array.isArray(s.owned)?s.owned:["ural"];
 s.miners=Array.isArray(s.miners)?s.miners:[];
 s.claimed=Array.isArray(s.claimed)?s.claimed:[];
 if(!s.owned.includes("ural"))s.owned.unshift("ural");
 return s;
}

function load(){
 try{
  const v=localStorage.getItem(KEY);
  if(v)return normalize(JSON.parse(v));
  const old=localStorage.getItem("minerEmpire_v4")||
            localStorage.getItem("minerEmpire_v3")||
            localStorage.getItem("minerEmpireSave");
  if(old){
   const p=JSON.parse(old),s=fresh();
   s.coins=Number(p.coins)||500;
   s.xp=Number(p.xp)||0;
   s.level=Number(p.level)||1;
   s.ore={...s.ore,...(p.ore||{})};
   s.pick=Number(p.pickaxe)||Number(p.pick)||1;
   s.clicks=Number(p.clicks)||0;
   s.mined=Number(p.totalMined)||0;
   s.sold=Number(p.sold)||0;
   s.miners=Array.isArray(p.miners)?p.miners.map(m=>({
    id:m.id||uid(),mineId:"ural",resource:m.resource||"iron",level:Number(m.level)||1
   })):[];
   s.buildings={...s.buildings,...(p.buildings||{})};
   return normalize(s);
  }
 }catch(e){console.warn("Ошибка загрузки сохранения",e)}
 return fresh();
}

let g=load(),tab="mine",lastClick=0,toastTimer;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){
 g.lastTime=Date.now();
 try{localStorage.setItem(KEY,JSON.stringify(g))}
 catch(e){console.warn("Сохранение недоступно",e)}
}
function fmt(n){return Math.floor(n||0).toLocaleString("ru-RU")}
function mine(){return MINES.find(m=>m.id===g.selected)||MINES[0]}
function xpNeed(){return 100+(g.level-1)*75}
function rank(){
 if(g.rep>=2000)return "Имперский магнат";
 if(g.rep>=1000)return "Промышленник";
 if(g.rep>=500)return "Крупный предприниматель";
 if(g.rep>=100)return "Горный управляющий";
 return "Начинающий старатель";
}
function toast(s){
 const el=document.getElementById("toast");
 el.textContent=s;el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove("show"),2300);
}
function xp(n){
 g.xp+=n*(1+(g.buildings.library||0)*.05);
 while(g.xp>=xpNeed()){
  g.xp-=xpNeed();g.level++;
  const bonus=g.level*100;
  g.coins+=bonus;g.coinsEarned+=bonus;
  toast("Новый уровень! +" + bonus+" монет");
 }
}
function addOre(type,n){
 g.ore[type]=(g.ore[type]||0)+n;
 g.mined+=n;
 if(g.minedTypes[type]!==undefined)g.minedTypes[type]+=n;
}
function rate(m){
 if(!MINES.some(x=>x.id===m.mineId)||!g.owned.includes(m.mineId))return 0;
 return (.12+(m.level-1)*.04);
}
function totalRate(){return g.miners.reduce((a,m)=>a+rate(m),0)}

function offline(){
 const now=Date.now();
 const elapsed=Math.max(0,(now-(g.lastTime||now))/1000);
 const seconds=Math.min(elapsed,14400);
 const workers=g.miners.filter(m=>g.owned.includes(m.mineId));
 const total=workers.reduce((a,m)=>a+rate(m),0);
 const amount=total*seconds*.25;
 if(amount>0&&total>0){
  workers.forEach(m=>{
   const n=amount*rate(m)/total;
   g.ore[m.resource]=(g.ore[m.resource]||0)+n;
   g.mined+=n;
  });
  setTimeout(()=>toast("Офлайн-добыча: "+fmt(amount)+" руды"),2500);
 }
 g.lastTime=now;save();
}

/* ДОБЫЧА */
function manualMine(){
 const now=Date.now();
 if(now-lastClick<450)return;
 lastClick=now;
 const resources=mine().resources;
 const type=resources[Math.floor(Math.random()*resources.length)];
 let amount=(1+(g.pick-1)*.25)*(1+(g.buildings.forge||0)*.05);
 if(Math.random()<(g.buildings.lab||0)*.02){
  amount+=1;toast("Лаборатория обнаружила дополнительную руду!");
 }
 addOre(type,amount);g.clicks++;
 xp(2);save();render();
}
function sell(type){
 const n=Math.floor(g.ore[type]||0);
 if(n<1){toast("Нет руды для продажи");return}
 const money=Math.floor(n*RES[type].price*(1+(g.buildings.treasury||0)*.03));
 g.ore[type]-=n;g.coins+=money;g.coinsEarned+=money;
 g.sold+=n;g.rep+=Math.floor(money/100);
 xp(Math.max(1,Math.floor(n/10)));
 save();toast("Продано за "+fmt(money)+" монет");render();
}
function sellAll(){
 let count=0,money=0;
 Object.keys(RES).forEach(t=>{
  const n=Math.floor(g.ore[t]||0);
  count+=n;money+=n*RES[t].price;g.ore[t]-=n;
 });
 if(!count){toast("Склад пуст");return}
 money=Math.floor(money*(1+(g.buildings.treasury||0)*.03));
 g.coins+=money;g.coinsEarned+=money;g.sold+=count;
 g.rep+=Math.floor(money/100);xp(Math.floor(count/10));
 save();toast("Продано "+fmt(count)+" руды");render();
}

/* ПОКУПКИ */
function buyMine(id){
 const m=MINES.find(x=>x.id===id);
 if(!m||g.owned.includes(id))return;
 if(g.level<m.level){toast("Нужен уровень "+m.level);return}
 if(g.coins<m.price){toast("Не хватает монет");return}
 g.coins-=m.price;g.owned.push(id);g.selected=id;
 g.rep+=50;xp(40);save();toast("Новое месторождение открыто!");render();
}
function chooseMine(id){
 if(!g.owned.includes(id))return;
 g.selected=id;save();render();
}
function hire(){
 const cost=Math.floor(500*Math.pow(1.45,g.miners.length));
 if(g.coins<cost){toast("Недостаточно монет");return}
 g.coins-=cost;
 g.miners.push({id:uid(),mineId:g.selected,resource:mine().resources[0],level:1});
 g.rep+=10;xp(15);save();toast("Шахтёр нанят");render();
}
function upgradeWorker(id){
 const m=g.miners.find(x=>x.id===id);
 if(!m)return;
 const cost=Math.floor(350*Math.pow(1.6,m.level-1));
 if(g.coins<cost){toast("Не хватает монет");return}
 g.coins-=cost;m.level++;xp(10);save();render();
}
function buyPick(){
 const cost=Math.floor(800*Math.pow(1.8,g.pick-1));
 if(g.coins<cost){toast("Недостаточно монет");return}
 g.coins-=cost;g.pick++;xp(20);save();render();
}
function build(id){
 const b=BUILDINGS[id],level=g.buildings[id]||0;
 const cost=Math.floor(b.cost*Math.pow(1.8,level));
 if(g.coins<cost){toast("Недостаточно монет");return}
 g.coins-=cost;g.buildings[id]++;g.buildingsBought++;
 g.rep+=15;xp(20);save();toast("Здание улучшено");render();
}

/* КОНТРАКТЫ */
function newContract(){
 const choices=[
  {type:"sell",target:30+g.level*5,reward:300+g.level*100,name:"Поставка руды"},
  {type:"mine",target:40+g.level*10,reward:250+g.level*80,name:"План добычи"},
  {type:"gold",target:5+g.level,reward:500+g.level*100,name:"Золотой заказ"}
 ];
 const c=choices[Math.floor(Math.random()*choices.length)];
 g.contract={...c,startSell:g.sold,startMine:g.mined,startGold:g.minedTypes.gold};
 save();render();
}
function contractProgress(){
 const c=g.contract;if(!c)return 0;
 if(c.type==="sell")return g.sold-c.startSell;
 if(c.type==="mine")return g.mined-c.startMine;
 return g.minedTypes.gold-c.startGold;
}
function claimContract(){
 const c=g.contract;
 if(!c||contractProgress()<c.target)return;
 g.coins+=c.reward;g.coinsEarned+=c.reward;
 g.rep+=25;g.contractsDone++;g.contract=null;
 xp(35);save();toast("Контракт выполнен!");render();
}

/* СУНДУКИ */
function chest(){
 const cost=1000+g.chests*250;
 if(g.coins<cost){toast("Сундук стоит "+cost+" монет");return}
 g.coins-=cost;g.chests++;
 const roll=Math.random();
 let message="";
 if(roll<.5){
  const n=5+Math.floor(Math.random()*15);
  const types=mine().resources,t=types[Math.floor(Math.random()*types.length)];
  g.ore[t]+=n;message=RES[t].name+" × "+n;
 }else if(roll<.9){
  const n=500+Math.floor(Math.random()*1500);
  g.coins+=n;g.coinsEarned+=n;message=n+" монет";
 }else{
  const types=["silver","gold","amethyst","emerald","diamond"];
  const t=types[Math.floor(Math.random()*types.length)];
  g.ore[t]+=5;message=RES[t].name+" × 5";
 }
 xp(15);save();toast("🎁 В сундуке: "+message);render();
}

/* ЭКСПЕДИЦИИ */
function startExpedition(){
 if(g.expedition){toast("Экспедиция уже отправлена");return}
 if(g.coins<300){toast("Нужно 300 монет");return}
 g.coins-=300;g.expedition={end:Date.now()+60000};save();render();
}
function claimExpedition(){
 if(!g.expedition||Date.now()<g.expedition.end)return;
 const bonus=1+(g.buildings.station||0)*.05;
 const money=Math.floor((500+Math.random()*700)*bonus);
 const all=Object.keys(RES);
 const t=all[Math.floor(Math.random()*all.length)];
 g.coins+=money;g.coinsEarned+=money;
 g.ore[t]+=5+Math.floor(Math.random()*8);
 g.expeditions++;g.rep+=20;g.expedition=null;
 xp(35);save();toast("Экспедиция вернулась с добычей!");render();
}

/* ЗАДАНИЯ */
function taskValue(type){
 switch(type){
  case"mined":return g.mined;
  case"sold":return g.sold;
  case"miners":return g.miners.length;
  case"pick":return g.pick;
  case"mines":return g.owned.length;
  case"buildings":return g.buildingsBought;
  case"gold":return g.minedTypes.gold;
  case"amethyst":return g.minedTypes.amethyst;
  case"diamond":return g.minedTypes.diamond;
  case"rep":return g.rep;
  case"expeditions":return g.expeditions;
  case"level":return g.level;
  default:return 0;
 }
}
function claimTask(id){
 const t=TASKS.find(x=>x.id===id);
 if(!t||g.claimed.includes(id)||taskValue(t.type)<t.goal)return;
 g.claimed.push(id);g.coins+=t.reward;g.coinsEarned+=t.reward;
 g.rep+=10;xp(20);save();toast("Награда получена!");render();
}

/* ЕЖЕДНЕВНАЯ НАГРАДА */
function daily(){
 const today=new Date().toDateString();
 if(g.daily===today){toast("Награда уже получена сегодня");return}
 g.streak++;
 const reward=300+Math.min(g.streak,7)*100;
 g.daily=today;g.coins+=reward;g.coinsEarned+=reward;
 g.rep+=10;xp(25);save();toast("Ежедневная награда: "+reward+" монет");render();
}

}

function subPage(title,html){

}

 subPage("🏆 Достижения",`
 <div class="panel"><div class="panel-title">Путь промышленника</div><div class="muted">Выполняй задачи и получай награды.</div></div>
 ${TASKS.map(t=>{
  const v=taskValue(t.type),done=v>=t.goal,claimed=g.claimed.includes(t.id);
  return `<div class="card">
   <div class="row"><strong>${t.name}</strong><span class="badge">${claimed?"Получено":done?"Готово":"В процессе"}</span></div>

   <div class="progress"><div style="width:${Math.min(100,v/t.goal*100)}%"></div></div>

   ${done&&!claimed?`<button class="btn" style="margin-top:9px" data-action="claim-task" data-id="${t.id}">Забрать награду</button>`:""}

 const c=g.contract;
 if(!c){
  subPage("📜 Контракты",`<div class="panel"><div class="panel-title">Новый заказ</div><div class="muted">Получай специальные задания от торговцев и промышленников.</div><button class="btn" style="margin-top:15px" data-action="new-contract">Получить контракт</button></div>`);
  return;
 }
 const p=contractProgress();
 subPage("📜 Контракт",`
 <div class="panel">
  <div class="panel-title">${c.name}</div>
  <div class="muted">${c.type==="sell"?"Продай руду":c.type==="mine"?"Добудь руду":"Добудь золото"}.</div>

  ${p>=c.target?'<button class="btn" style="margin-top:12px" data-action="claim-contract">Забрать награду</button>':'<div class="muted" style="margin-top:12px">Продолжай работать, чтобы выполнить заказ.</div>'}
 </div>`);
}

/* СОБЫТИЯ */
document.addEventListener("click",e=>{
 const tabButton=e.target.closest("[data-tab]");
 if(tabButton){
  tab=tabButton.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  render();return;
 }
 const b=e.target.closest("[data-action]");
 if(!b)return;
 const a=b.dataset.action,id=b.dataset.id;
 switch(a){
  case"mine":manualMine();break;
  case"buy-mine":buyMine(id);break;
  case"choose":chooseMine(id);break;
  case"hire":hire();break;
  case"upgrade-worker":upgradeWorker(id);break;
  case"sell":sell(id);break;
  case"sell-all":sellAll();break;
  case"pick":buyPick();break;
  case"build":build(id);break;
  case"quests":questsPage();break;
  case"buildings":buildingsPage();break;
  case"contracts":contractPage();break;
  case"new-contract":newContract();break;
  case"claim-contract":claimContract();break;
  case"claim-task":claimTask(id);break;
  case"expedition":expeditionPage();break;
  case"start-expedition":startExpedition();break;
  case"claim-expedition":claimExpedition();break;
  case"chest":chest();break;
  case"daily":daily();break;
  case"profile":profilePage();break;
  case"back":render();break;
  case"save":save();toast("Сохранено");break;
 }
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.action==="worker-resource"){
  const m=g.miners.find(x=>x.id===el.dataset.id);
  if(m&&mineResources(m).includes(el.value)){m.resource=el.value;save();render()}
 }
});
function mineResources(m){
 return (MINES.find(x=>x.id===m.mineId)||MINES[0]).resources;
}

/* ТАЙМЕР */
let lastSave=Date.now();
function tick(){
 for(const m of g.miners){
  if(!g.owned.includes(m.mineId))continue;
  const n=rate(m)/60;
  g.ore[m.resource]=(g.ore[m.resource]||0)+n;
  g.mined+=n;
  if(g.minedTypes[m.resource]!==undefined)g.minedTypes[m.resource]+=n;
 }
 if(g.expedition&&Date.now()>=g.expedition.end&&tab==="more"){
  // Экран обновится при следующем открытии экспедиций.
 }
 if(Date.now()-lastSave>10000){save();lastSave=Date.now()}
 header();
}
setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
window.addEventListener("pagehide",save);

/* ЗАПУСК */
function boot(){
 try{
  offline();render();
  const splash=document.getElementById("splash");
  setTimeout(()=>{
   splash.classList.add("hide");
   setTimeout(()=>splash.remove(),700);
  },2300);
 }catch(err){
  console.error("Ошибка запуска:",err);
  document.getElementById("load-text").textContent="Ошибка запуска. Обнови страницу.";
 }
}
window.addEventListener("error",e=>{
 if(e.message&&e.message!=="Script error.")console.error("Ошибка игры:",e.message);
});
if(window.Telegram?.WebApp){
 try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
}
boot();
</script>
