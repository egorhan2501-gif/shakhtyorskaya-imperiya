<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101b2a">
<title>Шахтёрская Империя</title>

<style>
*{box-sizing:border-box}
:root{
 --gold:#ffc66d;
 --blue:#65b9ff;
 --panel:rgba(14,25,39,.91);
 --border:rgba(255,255,255,.10);
 --muted:#9aadc1;
}
body{
 margin:0;
 background:#091522;
 color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
 overflow-x:hidden;
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

/* ЗАГРУЗКА */
#splash{
 position:fixed;inset:0;z-index:1000;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;padding:25px;
 background:
 linear-gradient(180deg,rgba(4,15,29,.3),#07121e 95%),
 linear-gradient(120deg,#dce8f2,#315e83 45%,#102b45 75%,#071421);
 transition:opacity .6s;
}
#splash.hide{opacity:0;pointer-events:none}
.splash-flag{
 width:160px;height:7px;border-radius:5px;
 background:linear-gradient(to bottom,#fff 0 33%,#2875d2 33% 66%,#e34444 66%);
 margin-bottom:25px;
 box-shadow:0 0 25px #ffffff40;
}
.splash-logo{font-size:65px;animation:float 2s infinite ease-in-out}
.splash-title{font-size:27px;font-weight:900;letter-spacing:1px;margin:15px 0 8px}
.splash-sub{color:#c0d3e4;font-size:13px}
.loading-track{
 width:230px;height:7px;background:#ffffff25;
 border-radius:10px;margin-top:30px;overflow:hidden;
}
.loading-bar{
 height:100%;width:0;background:var(--gold);
 border-radius:10px;animation:loading 2.1s forwards;
}
#loading-text{font-size:12px;color:#b9c8d7;margin-top:12px}
@keyframes loading{to{width:100%}}
@keyframes float{50%{transform:translateY(-9px)}}

/* ДИНАМИЧЕСКИЙ ФОН */
#world{
 position:fixed;inset:0;z-index:-2;
 overflow:hidden;
 background:linear-gradient(180deg,#193b5b,#42637a 40%,#132c36 75%,#07141d);
 transition:background 1s;
}
#world::before{
 content:"";position:absolute;inset:0;
 background:
 linear-gradient(180deg,rgba(255,255,255,.16) 0 10%,transparent 35%),
 linear-gradient(180deg,transparent 0 12%,rgba(255,255,255,.18) 12% 15%,rgba(35,105,190,.22) 15% 18%,rgba(210,45,45,.18) 18% 21%,transparent 21%);
}
#mountains{
 position:absolute;bottom:24%;width:120%;left:-10%;height:45%;
 background:#354f62;
 clip-path:polygon(0 100%,0 60%,12% 35%,21% 62%,35% 8%,48% 57%,62% 18%,76% 60%,88% 30%,100% 65%,100% 100%);
}
#mountains:after{
 content:"";position:absolute;inset:0;
 background:#8ba0ae;
 clip-path:polygon(0 60%,12% 35%,21% 62%,35% 8%,48% 57%,62% 18%,76% 60%,88% 30%,100% 65%,100% 75%,88% 42%,76% 72%,62% 30%,48% 70%,35% 22%,21% 73%,12% 45%,0 70%);
}
#forest{
 position:absolute;bottom:0;height:39%;width:100%;
 background:linear-gradient(180deg,#1c4943,#081b21);
 clip-path:polygon(0 25%,5% 5%,10% 33%,15% 8%,20% 38%,25% 7%,30% 35%,35% 5%,40% 36%,45% 9%,50% 38%,55% 5%,60% 35%,65% 8%,70% 40%,75% 5%,80% 35%,85% 8%,90% 38%,95% 5%,100% 30%,100% 100%,0 100%);
}
#village{
 position:absolute;bottom:9%;left:5%;font-size:25px;
 filter:drop-shadow(0 0 12px #ffb65a);
}
#mine-door{
 position:absolute;bottom:7%;left:50%;transform:translateX(-50%);
 font-size:75px;filter:drop-shadow(0 0 25px #ffb65a);
}
#world.ural{background:linear-gradient(#37618a,#213c50 55%,#091a20)}
#world.siberia{background:linear-gradient(#8ca9c2,#34536c 48%,#0b2536)}
#world.altai{background:linear-gradient(#574d79,#b18c70 45%,#172b39)}
#world.karelia{background:linear-gradient(#315c62,#1c4649 50%,#071b20)}
#world.yakutia{background:linear-gradient(#9abbd4,#547d9b 45%,#102c40)}
#world.polar{background:linear-gradient(#7899b2,#293d5b 50%,#071523)}
#world.siberia #mountains,#world.yakutia #mountains,#world.polar #mountains{background:#b7c9d5}
#world.karelia #forest{background:linear-gradient(#28615a,#092723)}
#world.altai #forest{background:linear-gradient(#78573e,#251f25)}

/* ОСНОВНОЙ ИНТЕРФЕЙС */
#app{max-width:650px;margin:auto;min-height:100vh;padding-bottom:90px}
.topbar{
 display:flex;align-items:center;justify-content:space-between;
 padding:13px 15px;background:rgba(5,14,25,.78);
 border-bottom:1px solid var(--border);backdrop-filter:blur(12px);
 position:sticky;top:0;z-index:20;
}
.brand{font-weight:900;font-size:16px}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:normal;margin-top:3px}
.balance{
 background:#332a1b;border:1px solid #8e6a36;
 padding:9px 12px;border-radius:12px;color:var(--gold);
 font-weight:bold;font-size:14px;
}
.content{padding:14px}
.panel{
 background:var(--panel);border:1px solid var(--border);
 border-radius:17px;padding:15px;margin-bottom:13px;
 backdrop-filter:blur(12px);
 box-shadow:0 8px 25px #0002;
}
.panel-title{font-size:16px;font-weight:800;margin-bottom:12px}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.small{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{
 background:#ffffff09;border:1px solid var(--border);
 border-radius:13px;padding:12px;
}
.stat strong{display:block;font-size:18px;margin-top:5px}
.stat span{font-size:11px;color:var(--muted)}
.btn{
 border:0;border-radius:12px;padding:12px 14px;
 background:linear-gradient(135deg,#e4a84d,#b8792e);
 color:#201608;font-weight:800;width:100%;
}
.btn.blue{background:linear-gradient(135deg,#5ab8ff,#2873b6);color:#071b2a}
.btn.dark{background:#25364a;color:#fff;border:1px solid var(--border)}
.btn.red{background:#783b3b;color:#fff}
.btn:active{transform:scale(.98)}
.mining-area{
 text-align:center;padding:22px 12px;
 background:linear-gradient(180deg,#ffffff09,#00000020);
 border-radius:16px;border:1px solid var(--border);
}
.mine-art{font-size:82px;display:block;filter:drop-shadow(0 5px 10px #0008)}
.mine-button{
 width:155px;height:155px;border-radius:50%;border:5px solid #e3ae5e;
 background:radial-gradient(circle at 35% 25%,#8b653c,#3b2c20 65%,#17110c);
 color:white;font-size:55px;margin:12px auto;
 box-shadow:0 0 30px #e7a74b33,inset 0 0 20px #0008;
}
.mine-button:active{transform:scale(.94)}
.resource-line{
 display:flex;justify-content:space-between;align-items:center;
 padding:10px 0;border-bottom:1px solid #ffffff12;
}
.resource-line:last-child{border:0}
.item-icon{font-size:25px;margin-right:9px}
.item-name{font-weight:bold;font-size:13px}
.tabs{
 position:fixed;bottom:0;left:0;right:0;z-index:30;
 display:flex;justify-content:space-around;
 background:rgba(7,16,27,.97);border-top:1px solid var(--border);
 padding:8px 3px max(8px,env(safe-area-inset-bottom));
 backdrop-filter:blur(15px);
}
.tab{
 border:0;background:none;color:#91a3b5;
 font-size:10px;display:flex;flex-direction:column;
 align-items:center;gap:4px;min-width:0;flex:1;
}
.tab b{font-size:21px}
.tab.active{color:var(--gold)}
.card{
 background:#ffffff08;border:1px solid var(--border);
 border-radius:14px;padding:13px;margin-bottom:10px;
}
.progress{height:7px;border-radius:10px;background:#ffffff17;overflow:hidden;margin:9px 0}
.progress div{height:100%;background:linear-gradient(90deg,#e6a84c,#ffe0a0);border-radius:10px}
.toast{
 position:fixed;top:75px;left:50%;transform:translate(-50%,-15px);
 opacity:0;pointer-events:none;z-index:100;
 background:#172b3e;border:1px solid #607b91;
 padding:12px 18px;border-radius:12px;
 transition:.25s;text-align:center;max-width:90%;font-size:13px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{
 display:inline-block;padding:4px 7px;border-radius:7px;
 background:#ffffff12;color:var(--gold);font-size:10px;
}
.empty{text-align:center;padding:25px;color:var(--muted)}
</style>
</head>

<body>

<div id="splash">
 <div class="splash-flag"></div>
 <div class="splash-logo">⛏️</div>
 <div class="splash-title">ШАХТЁРСКАЯ ИМПЕРИЯ</div>
 <div class="splash-sub">От маленькой шахты до огромной империи</div>
 <div class="loading-track"><div class="loading-bar"></div></div>
 <div id="loading-text">Подготавливаем шахты...</div>
</div>

<div id="world" class="ural">
 <div id="mountains"></div>
 <div id="forest"></div>
 <div id="village">🏠 🏘️ 🏚️</div>
 <div id="mine-door">🚇</div>
</div>

<div id="app">
 <header class="topbar">
  <div class="brand">⛏️ ШАХТЁРСКАЯ ИМПЕРИЯ
   <small id="top-level">Уровень 1 · Новичок</small>
  </div>
  <div class="balance">🪙 <span id="coins">500</span></div>
 </header>

 <main class="content" id="screen"></main>
</div>

<nav class="tabs">
 <button class="tab active" data-tab="mine"><b>⛏️</b>Шахта</button>
 <button class="tab" data-tab="mines"><b>🏔️</b>Шахты</button>
 <button class="tab" data-tab="workers"><b>👷</b>Шахтёры</button>
 <button class="tab" data-tab="market"><b>💰</b>Рынок</button>
 <button class="tab" data-tab="more"><b>☰</b>Ещё</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================
   ДАННЫЕ ИГРЫ
========================= */

const SAVE_KEY = "minerEmpire_v4";

const RESOURCES = {
 iron:{name:"Железная руда",icon:"🪨",price:2},
 copper:{name:"Медная руда",icon:"🟠",price:4},
 silver:{name:"Серебро",icon:"🥈",price:10},
 gold:{name:"Золото",icon:"🥇",price:20},
 amethyst:{name:"Аметист",icon:"💜",price:35},
 emerald:{name:"Изумруд",icon:"💚",price:60},
 diamond:{name:"Алмаз",icon:"💎",price:120}
};

const MINES = [
 {id:"ural",name:"Уральская шахта",price:0,level:1,
  resources:["iron","copper"],theme:"ural",
  description:"Старая добрая шахта в горах Урала."},
 {id:"siberia",name:"Сибирские рудники",price:2500,level:3,
  resources:["copper","silver"],theme:"siberia",
  description:"Холодные рудники с богатыми залежами."},
 {id:"altai",name:"Алтайские месторождения",price:9000,level:5,
  resources:["gold","amethyst"],theme:"altai",
  description:"Горные породы и драгоценные кристаллы."},
 {id:"karelia",name:"Карельские глубины",price:25000,level:8,
  resources:["silver","emerald"],theme:"karelia",
  description:"Загадочные шахты среди лесов и озёр."},
 {id:"yakutia",name:"Якутские копи",price:65000,level:12,
  resources:["gold","diamond"],theme:"yakutia",
  description:"Суровые земли с редкими минералами."},
 {id:"polar",name:"Заполярные шахты",price:150000,level:16,
  resources:["amethyst","emerald","diamond"],theme:"polar",
  description:"Самые дальние и богатые шахты империи."}
];

const BUILDINGS = {
 forge:{name:"Кузница",icon:"🔥",base:1200,desc:"+5% ручной добычи за уровень"},
 library:{name:"Библиотека",icon:"📚",base:1500,desc:"+5% опыта за уровень"},
 treasury:{name:"Казначейство",icon:"🏦",base:2000,desc:"+3% денег при продаже за уровень"},
 lab:{name:"Лаборатория",icon:"🔬",base:3000,desc:"+2% шанс бонусной руды за уровень"},
 station:{name:"Вокзал",icon:"🚂",base:2500,desc:"+5% наград экспедиций за уровень"}
};

const QUESTS = [
 {id:"q1",name:"Первый удар",desc:"Добудь 10 единиц руды",type:"mined",goal:10,reward:100},
 {id:"q2",name:"Работа пошла",desc:"Добудь 100 единиц руды",type:"mined",goal:100,reward:350},
 {id:"q3",name:"Торговец",desc:"Продай 30 единиц руды",type:"sold",goal:30,reward:180},
 {id:"q4",name:"Большая сделка",desc:"Продай 200 единиц руды",type:"sold",goal:200,reward:600},
 {id:"q5",name:"Команда",desc:"Найми 2 шахтёров",type:"miners",goal:2,reward:300},
 {id:"q6",name:"Начальник смены",desc:"Найми 5 шахтёров",type:"miners",goal:5,reward:800},
 {id:"q7",name:"Улучшение",desc:"Улучши кирку до 2 уровня",type:"pickaxe",goal:2,reward:250},
 {id:"q8",name:"Мастер",desc:"Улучши кирку до 5 уровня",type:"pickaxe",goal:5,reward:1200},
 {id:"q9",name:"Расширение",desc:"Открой вторую шахту",type:"mines",goal:2,reward:500},
 {id:"q10",name:"Империя",desc:"Открой четыре шахты",type:"mines",goal:4,reward:2500},
 {id:"q11",name:"Строитель",desc:"Построй два здания",type:"buildings",goal:2,reward:600},
 {id:"q12",name:"Первые сокровища",desc:"Добудь 10 золотых руд",type:"gold",goal:10,reward:500},
 {id:"q13",name:"Кристаллы",desc:"Добудь 10 аметистов",type:"amethyst",goal:10,reward:700},
 {id:"q14",name:"Богач",desc:"Накопи 10 000 монет",type:"coinsEarned",goal:10000,reward:1000},
 {id:"q15",name:"Путешественник",desc:"Заверши экспедицию",type:"expeditions",goal:1,reward:700},
 {id:"q16",name:"Опытный шахтёр",desc:"Достигни 5 уровня",type:"level",goal:5,reward:900},
 {id:"q17",name:"Алмазная лихорадка",desc:"Добудь 5 алмазов",type:"diamond",goal:5,reward:1500},
 {id:"q18",name:"Миллионер",desc:"Продай руды на 20 000 монет",type:"earnedSales",goal:20000,reward:2500}
];

function freshSave(){
 return {
  coins:500,xp:0,level:1,
  ore:{iron:0,copper:0,silver:0,gold:0,amethyst:0,emerald:0,diamond:0},
  ownedMines:["ural"],selectedMine:"ural",
  miners:[],buildings:{forge:0,library:0,treasury:0,lab:0,station:0},
  pickaxe:1,clicks:0,sold:0,totalMined:0,
  coinsEarned:0,salesEarned:0,
  minedBy:{gold:0,amethyst:0,diamond:0},
  expeditions:0,expedition:null,
  claimed:[],lastTime:Date.now(),
  dailyDate:"",dailyStreak:0,
  totalBuildings:0
 };
}

function loadSave(){
 let raw=null;
 try{
  raw=localStorage.getItem(SAVE_KEY);
  if(raw){
   const parsed=JSON.parse(raw);
   return normalizeSave(parsed);
  }

  const old=localStorage.getItem("minerEmpire_v3") ||
            localStorage.getItem("minerEmpireSave");

  if(old){
   const previous=JSON.parse(old);
   const s=freshSave();
   s.coins=Number(previous.coins)||500;
   s.xp=Number(previous.xp)||0;
   s.level=Number(previous.level)||1;
   s.ore={...s.ore,...(previous.ore||{})};
   s.pickaxe=Number(previous.pickaxe)||1;
   s.clicks=Number(previous.clicks)||0;
   s.sold=Number(previous.sold)||0;
   s.totalMined=Number(previous.totalMined)||0;
   s.miners=Array.isArray(previous.miners)?previous.miners.map(m=>({
    id:m.id||makeId(),mineId:"ural",
    resource:m.resource||"iron",level:Number(m.level)||1
   })):[];
   s.buildings={...s.buildings,...(previous.buildings||{})};
   s.ownedMines=["ural"];
   s.selectedMine="ural";
   s.coinsEarned=s.coins;
   s.lastTime=Date.now();
   return normalizeSave(s);
  }
 }catch(e){
  console.warn("Не удалось прочитать сохранение",e);
 }
 return freshSave();
}

function normalizeSave(s){
 const d=freshSave();
 s={...d,...s};
 s.ore={...d.ore,...(s.ore||{})};
 s.buildings={...d.buildings,...(s.buildings||{})};
 s.ownedMines=Array.isArray(s.ownedMines)?s.ownedMines:["ural"];
 if(!s.ownedMines.includes("ural"))s.ownedMines.unshift("ural");
 s.miners=Array.isArray(s.miners)?s.miners:[];
 s.claimed=Array.isArray(s.claimed)?s.claimed:[];
 s.minedBy={...d.minedBy,...(s.minedBy||{})};
 return s;
}

let game=loadSave();
let currentTab="mine";
let lastClick=0;
let toastTimer=null;

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function save(){
 game.lastTime=Date.now();
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));}
 catch(e){console.warn("Ошибка сохранения",e);}
}
function fmt(n){
 return Math.floor(n||0).toLocaleString("ru-RU");
}
function getMine(){
 return MINES.find(m=>m.id===game.selectedMine)||MINES[0];
}
function xpNeed(){
 return 100+(game.level-1)*75;
}
function addXP(n){
 const bonus=1+(game.buildings.library||0)*.05;
 game.xp+=n*bonus;
 while(game.xp>=xpNeed()){
  game.xp-=xpNeed();
  game.level++;
  game.coins+=game.level*100;
  game.coinsEarned+=game.level*100;
  notify("🎉 Новый уровень! Уровень "+game.level);
 }
}
function addOre(type,amount){
 if(!game.ore[type]&&game.ore[type]!==0)return;
 game.ore[type]+=amount;
 game.totalMined+=amount;
 if(game.minedBy[type]!==undefined)game.minedBy[type]+=amount;
}
function notify(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove("show"),2300);
}

/* =========================
   ОФЛАЙН ДОБЫЧА
========================= */

function minerRate(miner){
 const mine=MINES.find(m=>m.id===miner.mineId);
 if(!mine||!game.ownedMines.includes(miner.mineId))return 0;
 return .12+(miner.level-1)*.035;
}
function totalRate(){
 return game.miners.reduce((sum,m)=>sum+minerRate(m),0);
}
function calculateOffline(){
 const now=Date.now();
 const elapsed=Math.max(0,(now-(game.lastTime||now))/1000);
 const useful=Math.min(elapsed,4*60*60);
 const rate=totalRate();
 const amount=rate*useful*.25;
 if(amount>0){
  const active=game.miners.filter(m=>game.ownedMines.includes(m.mineId));
  let total=active.reduce((a,m)=>a+minerRate(m),0);
  if(total>0){
   active.forEach(m=>{
    const part=amount*minerRate(m)/total;
    game.ore[m.resource]=(game.ore[m.resource]||0)+part;
    game.totalMined+=part;
   });
   notify("🌙 Пока тебя не было, шахтёры добыли "+fmt(amount)+" руды!");
  }
 }
 game.lastTime=now;
 save();
}

/* =========================
   ДОБЫЧА И ЭКОНОМИКА
========================= */

function manualMine(){
 const now=Date.now();
 if(now-lastClick<450)return;
 lastClick=now;
 const mine=getMine();
 const resources=mine.resources;
 const type=resources[Math.floor(Math.random()*resources.length)];
 let amount=1+(game.pickaxe-1)*.25;
 amount*=1+(game.buildings.forge||0)*.05;

 if(Math.random()<(game.buildings.lab||0)*.02){
  amount+=1;
  notify("🔬 Лаборатория помогла найти дополнительную руду!");
 }
 game.ore[type]=(game.ore[type]||0)+amount;
 game.totalMined+=amount;
 game.clicks++;
 if(game.minedBy[type]!==undefined)game.minedBy[type]+=amount;
 addXP(2);
 save();
 updateHeader();
 render();
}

function sellResource(type){
 const amount=Math.floor(game.ore[type]||0);
 if(amount<=0){notify("У тебя пока нет этой руды");return;}
 const price=RESOURCES[type].price;
 const bonus=1+(game.buildings.treasury||0)*.03;
 const money=Math.floor(amount*price*bonus);
 game.ore[type]-=amount;
 game.coins+=money;
 game.coinsEarned+=money;
 game.salesEarned+=money;
 game.sold+=amount;
 addXP(Math.max(1,Math.floor(amount/10)));
 save();notify("Продано! Получено "+fmt(money)+" монет");
 render();
}

function sellAll(){
 let amount=0,money=0;
 for(const type in RESOURCES){
  const count=Math.floor(game.ore[type]||0);
  amount+=count;
  money+=count*RESOURCES[type].price;
  game.ore[type]-=count;
 }
 if(!amount){notify("Склад пуст");return;}
 money=Math.floor(money*(1+(game.buildings.treasury||0)*.03));
 game.coins+=money;
 game.coinsEarned+=money;
 game.salesEarned+=money;
 game.sold+=amount;
 addXP(Math.floor(amount/10));
 save();notify("Продано "+fmt(amount)+" руды за "+fmt(money)+" монет");
 render();
}

/* =========================
   ПОКУПКИ
========================= */

function buyMine(id){
 const mine=MINES.find(m=>m.id===id);
 if(!mine||game.ownedMines.includes(id))return;
 if(game.level<mine.level){notify("Нужен "+mine.level+" уровень");return;}
 if(game.coins<mine.price){notify("Недостаточно монет");return;}
 game.coins-=mine.price;
 game.ownedMines.push(id);
 game.selectedMine=id;
 addXP(30);
 save();notify("🏔️ Новая шахта открыта!");
 render();
}
function selectMine(id){
 if(!game.ownedMines.includes(id))return;
 game.selectedMine=id;
 save();render();
}
function hireMiner(){
 const mine=getMine();
 const cost=Math.floor(500*Math.pow(1.45,game.miners.length));
 if(game.coins<cost){notify("Не хватает монет");return;}
 game.coins-=cost;
 const resource=mine.resources[0];
 game.miners.push({id:makeId(),mineId:mine.id,resource,level:1});
 addXP(15);
 save();notify("👷 Шахтёр нанят!");
 render();
}
function upgradeMiner(id){
 const m=game.miners.find(x=>x.id===id);
 if(!m)return;
 const cost= Math.floor(350*Math.pow(1.6,m.level-1));
 if(game.coins<cost){notify("Не хватает монет");return;}
 game.coins-=cost;
 m.level++;
 addXP(10);
 save();notify("Шахтёр стал опытнее!");
 render();
}
function changeMinerResource(id,type){
 const m=game.miners.find(x=>x.id===id);
 if(!m)return;
 const mine=MINES.find(x=>x.id===m.mineId);
 if(!mine.resources.includes(type))return;
 m.resource=type;
 save();render();
}
function buyPickaxe(){
 const cost=Math.floor(800*Math.pow(1.8,game.pickaxe-1));
 if(game.coins<cost){notify("Недостаточно монет");return;}
 game.coins-=cost;
 game.pickaxe++;
 addXP(20);
 save();notify("⛏️ Кирка улучшена!");
 render();
}
function buyBuilding(id){
 const b=BUILDINGS[id];
 if(!b)return;
 const level=game.buildings[id]||0;
 const cost=Math.floor(b.base*Math.pow(1.8,level));
 if(game.coins<cost){notify("Недостаточно монет");return;}
 game.coins-=cost;
 game.buildings[id]++;
 game.totalBuildings++;
 addXP(20);
 save();notify(b.name+" улучшено!");
 render();
}

/* =========================
   ЭКСПЕДИЦИИ
========================= */

function startExpedition(){
 if(game.expedition){notify("Экспедиция уже идёт");return;}
 const cost=300;
 if(game.coins<cost){notify("Нужно 300 монет");return;}
 game.coins-=cost;
 game.expedition={end:Date.now()+60000};
 save();notify("🚂 Экспедиция отправилась!");
 render();
}
function claimExpedition(){
 if(!game.expedition||Date.now()<game.expedition.end)return;
 const bonus=1+(game.buildings.station||0)*.05;
 const reward=Math.floor((500+Math.random()*700)*bonus);
 const types=["iron","copper","silver","gold","amethyst","emerald"];
 const type=types[Math.floor(Math.random()*types.length)];
 game.coins+=reward;
 game.coinsEarned+=reward;
 game.ore[type]+=Math.floor(5+Math.random()*10);
 game.expeditions++;
 game.expedition=null;
 addXP(35);
 save();notify("🎁 Экспедиция принесла "+fmt(reward)+" монет и руду!");
 render();
}

/* =========================
   ЗАДАНИЯ И НАГРАДЫ
========================= */

function questValue(type){
 switch(type){
  case "mined":return game.totalMined;
  case "sold":return game.sold;
  case "miners":return game.miners.length;
  case "pickaxe":return game.pickaxe;
  case "mines":return game.ownedMines.length;
  case "buildings":return game.totalBuildings;
  case "gold":return game.minedBy.gold;
  case "amethyst":return game.minedBy.amethyst;
  case "coinsEarned":return game.coinsEarned;
  case "expeditions":return game.expeditions;
  case "level":return game.level;
  case "diamond":return game.minedBy.diamond;
  case "earnedSales":return game.salesEarned;
  default:return 0;
 }
}
function claimQuest(id){
 const q=QUESTS.find(x=>x.id===id);
 if(!q||game.claimed.includes(id))return;
 if(questValue(q.type)<q.goal)return;
 game.claimed.push(id);
 game.coins+=q.reward;
 game.coinsEarned+=q.reward;
 addXP(20);
 save();notify("🏆 Получено "+q.reward+" монет!");
 render();
}
function dailyReward(){
 const today=new Date().toDateString();
 if(game.dailyDate===today){notify("Ежедневная награда уже получена");return;}
 game.dailyStreak++;
 const reward=300+Math.min(game.dailyStreak,7)*100;
 game.dailyDate=today;
 game.coins+=reward;
 game.coinsEarned+=reward;
 addXP(25);
 save();notify("🎁 Ежедневная награда: "+reward+" монет!");
 render();
}

document.addEventListener("click",function(e){
 const tab=e.target.closest("[data-tab]");
 if(tab){
  const name=tab.dataset.tab;
  if(name==="more"){currentTab="more";}
  else{currentTab=name;}
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===name));
  render();return;
 }

 const btn=e.target.closest("[data-action]");
 if(!btn)return;
 const action=btn.dataset.action;
 const id=btn.dataset.id;

 switch(action){
  case "mine":manualMine();break;
  case "buy-mine":buyMine(id);break;
  case "select-mine":selectMine(id);break;
  case "hire":hireMiner();break;
  case "upgrade-miner":upgradeMiner(id);break;
  case "sell":sellResource(id);break;
  case "sell-all":sellAll();break;
  case "pickaxe":buyPickaxe();break;
  case "building":buyBuilding(id);break;
  case "quests":showQuests();break;
  case "buildings":showBuildings();break;
  case "expedition":showExpedition();break;
  case "profile":showProfile();break;
  case "daily":dailyReward();break;
  case "claim-quest":claimQuest(id);break;
  case "start-expedition":startExpedition();break;
  case "claim-expedition":claimExpedition();break;
  case "back":render();break;
  case "save":save();notify("💾 Прогресс сохранён");break;
 }
});

document.addEventListener("change",function(e){
 const el=e.target;
 if(el.dataset.action==="miner-resource"){
  changeMinerResource(el.dataset.id,el.value);
 }
});

/* =========================
   ИГРОВОЙ ТАЙМЕР
========================= */

function tick(){
 let changed=false;
 for(const m of game.miners){
  if(!game.ownedMines.includes(m.mineId))continue;
  const amount=minerRate(m)/60;
  game.ore[m.resource]=(game.ore[m.resource]||0)+amount;
  game.totalMined+=amount;
  if(game.minedBy[m.resource]!==undefined)game.minedBy[m.resource]+=amount;
  changed=true;
 }
 if(game.expedition&&Date.now()>=game.expedition.end){
  if(currentTab==="more")render();
 }
 updateHeader();
 if(changed){
  if(Math.floor(Date.now()/10000)!==Math.floor((Date.now()-1000)/10000))save();
 }
}
setInterval(tick,1000);

   ЗАПУСК

 try{
  calculateOffline();
  render();
  const splash=document.getElementById("splash");
  setTimeout(()=>{
   splash.classList.add("hide");
   setTimeout(()=>splash.remove(),650);
  },2100);
 }catch(e){
  console.error("Ошибка запуска игры:",e);
  document.getElementById("loading-text").textContent=
   "Не удалось запустить игру. Обнови страницу.";
  document.getElementById("splash").classList.add("hide");
 }
}

boot();
