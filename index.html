<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#17120e">
<title>Шахтёрская Империя 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17120e;color:#f5e6c8;font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer}
#loading{position:fixed;inset:0;z-index:100;background:linear-gradient(#17120e,#49301b,#17120e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{font-size:34px;font-weight:900;line-height:1.3}
.loadingbar{width:75%;height:10px;background:#392819;border-radius:20px;margin-top:20px;overflow:hidden}
.loadingfill{height:100%;width:0;background:#e9a83c;animation:load 1.5s forwards}
@keyframes load{to{width:100%}}
#app{display:none;max-width:650px;margin:auto;padding:12px 12px 90px}
.header{display:flex;justify-content:space-between;align-items:center;background:#302116;border:1px solid #624326;border-radius:14px;padding:14px;margin-bottom:12px}
.brand{font-weight:900;font-size:17px}
.money{color:#ffd36a;font-weight:bold}
.panel{background:#2b2017;border:1px solid #59402a;border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:19px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#3b2a1c;padding:11px;border-radius:10px;min-width:0}
.stat small{color:#c9ad88;display:block;margin-bottom:5px}
.stat b{font-size:17px;overflow-wrap:anywhere}
.item{background:#3b2a1c;border-radius:11px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item small{display:block;color:#c9ad88;margin-top:4px}
.action,.secondary{border:0;border-radius:9px;padding:10px 12px;font-weight:bold}
.action{background:#a96527;color:white}
.secondary{background:#493522;color:#f5e6c8;border:1px solid #765331}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#211810;border-top:1px solid #624326;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:10}
.tab{border:0;background:transparent;color:#c9ad88;font-size:11px;padding:6px 1px}
.tab span{display:block;font-size:21px;margin-bottom:3px}
.tab.active{color:#ffd36a}
.muted{color:#bba68b;font-size:13px}
.progress{height:7px;background:#17120e;border-radius:10px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:#d89b3e}
#error{display:none;background:#652b22;color:white;padding:15px;margin:12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>

<div id="loading">
 <div class="logo">⛏️ ШАХТЁРСКАЯ<br>ИМПЕРИЯ</div>
 <p>Подготавливаем шахты...</p>
 <div class="loadingbar"><div class="loadingfill"></div></div>
 <p id="loadStatus">Загрузка игры</p>
</div>

<div id="error"></div>

<div id="app">
 <div class="header">
  <div class="brand">⛏️ Шахтёрская Империя</div>
  <div class="money">🪙 <span id="coins">0</span></div>
 </div>
 <div id="content"></div>
</div>

<nav class="tabs">
 <button class="tab active" data-tab="mine"><span>⛏️</span>Шахта</button>
 <button class="tab" data-tab="miners"><span>👷</span>Шахтёры</button>
 <button class="tab" data-tab="city"><span>🏛️</span>Город</button>
 <button class="tab" data-tab="shop"><span>🛒</span>Магазин</button>
 <button class="tab" data-tab="profile"><span>👤</span>Профиль</button>
</nav>

<script>
"use strict";

const SAVE_KEY = "minerEmpireSave";

const RESOURCES = {
 iron:{name:"Железная руда",icon:"🪨"},
 copper:{name:"Медная руда",icon:"🟠"},
 gold:{name:"Золотая руда",icon:"🟡"},
 silver:{name:"Серебряная руда",icon:"⚪"},
 amethyst:{name:"Аметист",icon:"💜"},
 emerald:{name:"Изумруд",icon:"💚"}
};

const REGIONS = [
 "Уральские горы","Сибирские рудники",
 "Алтайские месторождения","Карельские глубины",
 "Якутские копи","Заполярные шахты"
];

const PROFESSIONS = [
 {name:"Рудокоп",bonus:"Железо"},
 {name:"Геолог",bonus:"Редкие минералы"},
 {name:"Золотодобытчик",bonus:"Золото"},
 {name:"Инженер",bonus:"Общая добыча"},
 {name:"Исследователь",bonus:"Исследования"},
 {name:"Кузнец",bonus:"Экипировка"}
];

const RARITIES = [
 {name:"Обычный",chance:60,mult:1},
 {name:"Необычный",chance:25,mult:1.2},
 {name:"Редкий",chance:10,mult:1.5},
 {name:"Эпический",chance:4,mult:2},
 {name:"Легендарный",chance:1,mult:3}
];

const BUILDINGS = [
 {id:"forge",name:"Кузница",icon:"⚒️",desc:"+5% добычи за уровень"},
 {id:"library",name:"Библиотека",icon:"📚",desc:"+5% опыта за уровень"},
 {id:"treasury",name:"Казначейство",icon:"🏦",desc:"+3% монет за уровень"},
 {id:"lab",name:"Лаборатория",icon:"🧪",desc:"+5% редких находок за уровень"},
 {id:"market",name:"Рынок",icon:"🏪",desc:"Снижение комиссии торговли"},
 {id:"station",name:"Вокзал",icon:"🚂",desc:"+5% наград экспедиций"}
];

function newGame(){
 return {
  coins:500,level:1,xp:0,region:0,
  miners:[],
  ore:{iron:0,copper:0,gold:0,silver:0,amethyst:0,emerald:0},
  buildings:{forge:0,library:0,treasury:0,lab:0,market:0,station:0},
  lastTime:Date.now(),totalMined:0
 };
}

function loadGame(){
 try{
  const saved=localStorage.getItem(SAVE_KEY);
  if(!saved)return newGame();
  const data=JSON.parse(saved);
  const base=newGame();
  return {
   ...base,...data,
   ore:{...base.ore,...(data.ore||{})},
   buildings:{...base.buildings,...(data.buildings||{})},
   miners:Array.isArray(data.miners)?data.miners:[]
  };
 }catch(e){
  console.error("Ошибка сохранения:",e);
  return newGame();
 }
}

let game=loadGame();
let currentTab="mine";
let started=false;

function showError(message){
 const box=document.getElementById("error");
 box.style.display="block";
 box.textContent="Ошибка игры: "+message;
 document.getElementById("loading").style.display="none";
 document.getElementById("app").style.display="block";
}

function save(){
 try{
  game.lastTime=Date.now();
  localStorage.setItem(SAVE_KEY,JSON.stringify(game));
 }catch(e){
  console.error("Не удалось сохранить:",e);
 }
}

function levelRate(level){
 if(level>=100)return 75;
 if(level>=80)return 50;
 if(level>=60)return 35;
 if(level>=40)return 20;
 if(level>=20)return 10;
 if(level>=10)return 5;
 if(level>=5)return 3;
 return 1;
}

function minerRate(miner){
 let rate=levelRate(miner.level)*miner.mult;
 if(miner.profession==="Рудокоп")rate*=1.15;
 if(miner.profession==="Золотодобытчик")rate*=1.1;
 if(miner.profession==="Инженер")rate*=1.1;
 rate*=1+game.buildings.forge*0.05;
 return rate;
}

function totalRate(){
 return game.miners.reduce((sum,m)=>sum+minerRate(m),0);
}

function addOre(seconds){
 const amount=totalRate()*seconds/60;
 if(amount<=0)return;
 game.ore.iron+=amount;
 game.totalMined+=amount;
}

function calculateOffline(){
 const now=Date.now();
 const previous=Number(game.lastTime)||now;
 const elapsed=Math.max(0,Math.min(now-previous,86400000));
 addOre(elapsed/1000);
 game.lastTime=now;
}

function gainXP(amount){
 game.xp+=amount;
 while(game.xp>=game.level*100){
  game.xp-=game.level*100;
  game.level++;
 }
}

function randomRarity(){
 const n=Math.random()*100;
 let total=0;
 for(const rarity of RARITIES){
  total+=rarity.chance;
  if(n<=total)return rarity;
 }
 return RARITIES[0];
}

function render(){
 document.getElementById("coins").textContent=Math.floor(game.coins).toLocaleString("ru-RU");
 const root=document.getElementById("content");
 if(currentTab==="mine")renderMine(root);
 else if(currentTab==="miners")renderMiners(root);
 else if(currentTab==="city")renderCity(root);
 else if(currentTab==="shop")renderShop(root);
 else if(currentTab==="profile")renderProfile(root);
}

function renderMine(root){
 root.innerHTML=`
 <section class="panel">
 <h2>⛏️ Главная шахта</h2>
 <p class="muted">Шахтёры добывают ресурсы автоматически.</p>
 <div class="stats">
 <div class="stat"><small>Добыча в минуту</small><b>${totalRate().toFixed(1)}</b></div>
 <div class="stat"><small>Уровень империи</small><b>${game.level}</b></div>
 <div class="stat"><small>Всего добыто</small><b>${Math.floor(game.totalMined)}</b></div>
 <div class="stat"><small>Регион</small><b>${REGIONS[game.region]||REGIONS[0]}</b></div>
 </div></section>
 <section class="panel"><h2>📦 Склад ресурсов</h2>
 ${Object.entries(RESOURCES).map(([id,r])=>`
 <div class="item"><div>${r.icon} ${r.name}</div><b>${Math.floor(game.ore[id])}</b></div>
 `).join("")}</section>
 <section class="panel"><h2>🗺️ Месторождения России</h2>
 ${REGIONS.map((r,i)=>`
 <div class="item"><div>📍 ${r}<small>${i===game.region?"Текущий регион":i<game.region?"Пройден":"Закрыт"}</small></div><b>${i<=game.region?"✅":"🔒"}</b></div>
 `).join("")}</section>`;
}

function renderMiners(root){
 root.innerHTML=`
 <section class="panel">
 <h2>👷 Мои шахтёры</h2>
 <p class="muted">Чем выше уровень шахтёра, тем больше его добыча.</p>
 <button class="action" onclick="hireMiner()">Нанять шахтёра — 100 🪙</button>
 <div style="margin-top:12px">
 ${game.miners.length?game.miners.map((m,i)=>`
 <div class="item"><div>
 <b>${m.rarity} ${m.name}</b>
 <small>${m.profession} · Уровень ${m.level}</small>
 <small>${minerRate(m).toFixed(1)} руды/мин</small>
 </div><button class="secondary" onclick="upgradeMiner(${i})">Улучшить</button></div>
 `).join(""):"<p class='muted'>Шахтёров пока нет.</p>"}
 </div></section>`;
}

function hireMiner(){
 if(game.coins<100)return alert("Недостаточно монет!");
 game.coins-=100;
 const rarity=randomRarity();
 const profession=PROFESSIONS[Math.floor(Math.random()*PROFESSIONS.length)];
 game.miners.push({
  name:"Шахтёр",rarity:rarity.name,mult:rarity.mult,
  profession:profession.name,level:1
 });
 save();render();
}

function upgradeMiner(i){
 const m=game.miners[i];
 if(!m)return;
 const cost=m.level*100;
 if(game.coins<cost)return alert("Недостаточно монет!");
 game.coins-=cost;
 m.level++;
 save();render();
}

function renderCity(root){
 root.innerHTML=`
 <section class="panel">
 <h2>🏛️ Город шахтёров</h2>
 <p class="muted">Покупай здания и улучшай свою империю. Город представлен меню, а не отдельной картой.</p>
 ${BUILDINGS.map(b=>{
  const lvl=game.buildings[b.id];
  const cost=200+lvl*250;
  return `<div class="item"><div><b>${b.icon} ${b.name}</b><small>${b.desc}</small><small>Уровень: ${lvl}/10</small></div>
  <button class="secondary" onclick="upgradeBuilding('${b.id}')">${lvl>=10?"Макс.":cost+" 🪙"}</button></div>`;
 }).join("")}
 </section>`;
}

function upgradeBuilding(id){
 const b=BUILDINGS.find(x=>x.id===id);
 if(!b)return;
 const lvl=game.buildings[id];
 if(lvl>=10)return;
 const cost=200+lvl*250;
 if(game.coins<cost)return alert("Недостаточно монет!");
 game.coins-=cost;
 game.buildings[id]++;
 save();render();
}

function renderShop(root){
 root.innerHTML=`
 <section class="panel"><h2>🛒 Магазин</h2>
 <p class="muted">Покупки за игровые монеты.</p>
 <div class="item"><div>⛏️ Улучшенная кирка<small>Увеличивает добычу шахтёров на 10%</small></div><button class="secondary" onclick="buyItem('pickaxe')">300 🪙</button></div>
 <div class="item"><div>📖 Учебник шахтёра<small>50 опыта империи</small></div><button class="secondary" onclick="buyItem('book')">150 🪙</button></div>
 <div class="item"><div>🎁 Сундук новичка<small>Случайная награда монетами</small></div><button class="secondary" onclick="buyItem('chest')">250 🪙</button></div>
 </section>`;
}

function buyItem(type){
 if(type==="pickaxe"){
  if(game.coins<300)return alert("Недостаточно монет!");
  game.coins-=300;
  game.miners.forEach(m=>m.mult*=1.1);
 }
 if(type==="book"){
  if(game.coins<150)return alert("Недостаточно монет!");
  game.coins-=150;
  gainXP(50);
 }
 if(type==="chest"){
  if(game.coins<250)return alert("Недостаточно монет!");
  game.coins-=250;
  const reward=100+Math.floor(Math.random()*401);
  game.coins+=reward;
  alert("Награда из сундука: "+reward+" монет!");
 }
 save();render();
}

function renderProfile(root){
 root.innerHTML=`
 <section class="panel"><h2>👤 Профиль</h2>
 <div class="stats">
 <div class="stat"><small>Уровень</small><b>${game.level}</b></div>
 <div class="stat"><small>Опыт</small><b>${game.xp}/${game.level*100}</b></div>
 <div class="stat"><small>Шахтёров</small><b>${game.miners.length}</b></div>
 <div class="stat"><small>Монеты</small><b>${Math.floor(game.coins)}</b></div>
 </div>
 <div class="progress"><div style="width:${Math.min(100,game.xp/(game.level*100)*100)}%"></div></div>
 <p class="muted">Прогресс автоматически сохраняется на этом устройстве.</p>
 </section>
 <section class="panel"><h2>⚙️ Управление</h2>
 <button class="secondary" onclick="save();alert('Прогресс сохранён!')">Сохранить сейчас</button>
 <button class="secondary" onclick="resetGame()">Начать заново</button>
 </section>`;
}

function resetGame(){
 if(!confirm("Удалить весь прогресс и начать заново?"))return;
 localStorage.removeItem(SAVE_KEY);
 location.reload();
}

function startGame(){
 if(started)return;
 started=true;
 try{
  calculateOffline();
  render();

  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="block";

  document.querySelectorAll(".tab").forEach(btn=>{
   btn.addEventListener("click",()=>{
    currentTab=btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b=>{
     b.classList.toggle("active",b===btn);
    });
    render();
   });
  });

  setInterval(()=>{
   addOre(1);
   gainXP(1);
   save();
   if(currentTab==="mine"||currentTab==="profile")render();
  },1000);

  setInterval(save,10000);
 }catch(e){
  console.error(e);
  showError(e.message||String(e));
 }
}

window.addEventListener("error",function(event){
 showError(event.message||"Неизвестная ошибка JavaScript");
});

window.addEventListener("DOMContentLoaded",()=>{
 document.getElementById("loadStatus").textContent="Запускаем игру...";
 try{
  startGame();
 }catch(e){
  showError(e.message||String(e));
 }
});

setTimeout(()=>{
 if(!started){
  showError("Игра не смогла запуститься. Проверь содержимое файла index.html.");
 }
},5000);
</script>
</body>
</html>
