 ["Сибирский первопроходец","🐻","rare","Золото",1.9],
 ["Уральский мастер","🛠️","uncommon","Железо",1.5],

const CHESTS=[

 {id:"pick1",name:"Стальная кирка",icon:"⛏️",slot:"pick",cost:800,bonus:0.12,desc:"+12% добычи"},

 {id:"academy",name:"Горная академия",icon:"🎓",desc:"Ускоряет получение опыта.",base:3500,bonus:"+10% опыта за уровень"},

const ROUTES=[

 {id:"siberia",name:"Сибирский путь",cost:2500,time:120,mult:1.35,unlock:1},

];
const QUESTS=[
 {id:"q1",name:"Первый улов",desc:"Добудь 25 единиц руды",goal:25,reward:300,type:"mined"},
 {id:"q2",name:"Торговец",desc:"Продай 100 единиц руды",goal:100,reward:600,type:"sold"},
 {id:"q3",name:"Новые горизонты",desc:"Открой вторую шахту",goal:2,reward:1000,type:"mines"},
 {id:"q4",name:"Крепкая артель",desc:"Собери 3 шахтёров",goal:3,reward:1200,type:"workers"},
 {id:"q5",name:"Промышленник",desc:"Построй 2 здания",goal:2,reward:1800,type:"buildings"},
 {id:"q6",name:"Состоятельный купец",desc:"Накопи 10 000 монет",goal:10000,reward:2000,type:"money"},
 {id:"q7",name:"Покоритель глубин",desc:"Добудь 1 000 единиц руды",goal:1000,reward:3000,type:"mined"},
 {id:"q8",name:"Железнодорожный магнат",desc:"Отправь поезд 3 раза",goal:3,reward:2500,type:"trains"},
 {id:"q9",name:"Исследователь",desc:"Заверши 2 экспедиции",goal:2,reward:3500,type:"expeditions"}
];
const ACHIEVEMENTS=[
 ["first_mine","Первый рудник","Открой первую шахту",()=>S.stats.mined>=1],
 ["worker5","Крепкая артель","Собери 5 шахтёров",()=>S.workers.length>=5],
 ["ore10k","Большая добыча","Добудь 10 000 руды",()=>S.stats.mined>=10000],
 ["legend","Легенда гильдии","Получи легендарного шахтёра",()=>S.workers.some(w=>WORKERS[w.id]?.rarity==="legendary")],
 ["allmines","Владыка недр","Открой все шахты",()=>S.mines.length===MINES.length],
 ["factory","Промышленная держава","Построй завод",()=>S.buildings.factory>0],
 ["explorer","Путешественник","Заверши 5 экспедиций",()=>S.stats.expeditions>=5],
 ["merchant","Крупный торговец","Продай 5000 руды",()=>S.stats.sold>=5000]
];

function fresh(){
 return {
  money:1000,xp:0,level:1,tokens:0,rep:0,
  ores:{iron:0,copper:0,silver:0,gold:0,amethyst:0,emerald:0,diamond:0},
  mines:[0],currentMine:0,workers:[],buildings:{},gear:[],
  equipment:{},stats:{mined:0,sold:0,trains:0,expeditions:0},
  quests:{},achievements:{},collections:{},pity:{wood:0,iron:0,gold:0,imperial:0},
  trains:[],expeditions:[],contracts:[],lastTime:now(),lastDaily:0,
  dailyStreak:0,selectedOre:"iron",lastSave:now()
 };
}
let S=fresh(),tab="mine",lastClick=0,tickCount=0;

function normalize(raw){
 const d=fresh();
 if(!raw||typeof raw!=="object")return d;
 const n=(v,min=0,max=1e12)=>Number.isFinite(Number(v))?Math.max(min,Math.min(max,Number(v))):min;
 d.money=n(raw.money);d.xp=n(raw.xp);d.level=n(raw.level,1,999);
 d.tokens=n(raw.tokens);d.rep=n(raw.rep);
 for(const k in d.ores)d.ores[k]=n(raw.ores?.[k]);
 d.mines=[...new Set((Array.isArray(raw.mines)?raw.mines:[0]).map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<MINES.length))];
 if(!d.mines.length)d.mines=[0];
 d.currentMine=d.mines.includes(Number(raw.currentMine))?Number(raw.currentMine):d.mines[0];
 d.workers=Array.isArray(raw.workers)?raw.workers.slice(0,100).map(w=>{
  const id=n(w.id,0,WORKERS.length-1);
  const mine=d.mines.includes(Number(w.mine))?Number(w.mine):d.mines[0];
  const allowed=MINES[mine].ores;
  return {uid:w.uid||uid(),id,level:n(w.level,1,4),mine,resource:allowed.includes(w.resource)?w.resource:allowed[0]};
 }):[];
 for(const b of BUILDINGS)d.buildings[b.id]=n(raw.buildings?.[b.id],0,100);
 d.gear=Array.isArray(raw.gear)?raw.gear.filter(id=>GEAR.some(g=>g.id===id)):[];
 d.equipment={};
 for(const slot of ["pick","lamp","uniform"]){
  const id=raw.equipment?.[slot];
  d.equipment[slot]=d.gear.includes(id)?id:null;
 }
 d.stats={...d.stats,...(raw.stats||{})};
 for(const k in d.stats)d.stats[k]=n(d.stats[k]);
 d.quests=raw.quests||{};d.achievements=raw.achievements||{};
 d.collections=raw.collections||{};d.pity={...d.pity,...(raw.pity||{})};
 d.trains=Array.isArray(raw.trains)?raw.trains:[];
 d.expeditions=Array.isArray(raw.expeditions)?raw.expeditions:[];
 d.contracts=Array.isArray(raw.contracts)?raw.contracts:[];
 d.lastDaily=n(raw.lastDaily);d.dailyStreak=n(raw.dailyStreak);
 d.lastTime=n(raw.lastTime,now()-3600000);
 d.selectedOre=ORES[raw.selectedOre]?raw.selectedOre:MINES[d.currentMine].ores[0];
 return d;
}
function load(){
 let raw=null;
 for(const key of ["minerEmpire_v7","minerEmpire_v6","minerEmpire_v5","minerEmpire_v4","minerEmpire_v3","minerEmpireSave","shakhtyorGame"]){
  try{const x=localStorage.getItem(key);if(x){raw=JSON.parse(x);break}}catch(e){}
 }
 S=normalize(raw);
}
function save(){
 try{
  S.lastSave=now();
  localStorage.setItem("minerEmpire_v7",JSON.stringify(S));
 }catch(e){toast("Не удалось сохранить прогресс");}
}
function toast(msg){
 const el=$("toast");el.textContent=msg;el.style.display="block";
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display="none",2300);
}
function xpNeed(){return 100+(S.level-1)*65}
function addXP(v){
 S.xp+=Math.floor(v*(1+S.buildings.academy*.1));
 while(S.xp>=xpNeed()){
  S.xp-=xpNeed();S.level++;S.money+=S.level*100;
  toast("Новый уровень! Теперь вы "+S.level+" уровня");
 }
}
function gearBonus(slot){
 const g=GEAR.find(x=>x.id===S.equipment[slot]);
 return g?g.bonus:0;
}
function totalBonus(){
 return 1+gearBonus("pick")+gearBonus("lamp")+
 S.buildings.forge*.05+S.buildings.factory*.08;
}
function workerRate(w){
 const def=WORKERS[w.id];if(!def)return 0;
 const mine=MINES[w.mine];if(!mine)return 0;
 const levelBonus=1+(w.level-1)*.25;
 return def.power*levelBonus*mine.mult*.12*totalBonus();
}
function income(){
 return S.workers.reduce((a,w)=>a+workerRate(w),0)*60;
}
function getWorker(id){return WORKERS[id]}
function randomOre(mine){
 const ores=MINES[mine].ores;
 const lab=S.buildings.lab*.02;
 const weights=ores.map((o,i)=>i===0?45: i===1?30:Math.max(5,20+lab*100));
 let r=Math.random()*weights.reduce((a,b)=>a+b,0);
 for(let i=0;i<ores.length;i++){r-=weights[i];if(r<=0)return ores[i]}
 return ores[0];
}
function addOre(id,amount){
 if(!ORES[id])return;
 S.ores[id]+=amount;S.stats.mined+=amount;
}
function manualMine(){
 if(now()-lastClick<430)return;
 lastClick=now();
 const ore=randomOre(S.currentMine);
 const amount=1+(Math.random()<.12?1:0);
 addOre(ore,amount);addXP(5);
 render();
}
function sellOre(id,amount){
 amount=Math.min(S.ores[id]||0,Math.floor(amount));
 if(amount<=0)return toast("Нет этой руды для продажи");
 const price=ORES[id].price*(1+S.buildings.treasury*.05)*(1+gearBonus("uniform"));
 const earned=Math.floor(amount*price);
 S.ores[id]-=amount;S.money+=earned;S.stats.sold+=amount;
 addXP(Math.ceil(amount*.15));S.rep+=Math.floor(amount/20);
 toast("Продано: "+fmt(earned)+" монет");
 save();render();
}
function sellAll(){
 let total=0;
 for(const id in S.ores){
  const amount=S.ores[id];
  total+=amount*ORES[id].price*(1+S.buildings.treasury*.05)*(1+gearBonus("uniform"));
  S.stats.sold+=amount;S.ores[id]=0;
 }
 if(total<=0)return toast("Нет руды для продажи");
 S.money+=Math.floor(total);S.rep+=Math.floor(total/1000);addXP(20);
 toast("Вся руда продана");
 save();render();
}
function buyMine(id){
 const m=MINES[id];
 if(S.mines.includes(id))return;
 if(S.level<m.level)return toast("Требуется "+m.level+" уровень");
 if(S.money<m.cost)return toast("Недостаточно монет");
 S.money-=m.cost;S.mines.push(id);S.currentMine=id;
 S.selectedOre=m.ores[0];addXP(40);
 toast("Открыта шахта: "+m.name);save();render();
}
function chooseMine(id){
 if(!S.mines.includes(id))return;
 S.currentMine=id;S.selectedOre=MINES[id].ores[0];render();
}
function workerCost(w){return [0,0,0,0][w.level-1]||0}
function assignWorker(uidValue,mine,resource){
 const w=S.workers.find(x=>x.uid===uidValue);if(!w)return;
 mine=Number(mine);
 if(!S.mines.includes(mine))return toast("Шахта не открыта");
 if(!MINES[mine].ores.includes(resource))resource=MINES[mine].ores[0];
 w.mine=mine;w.resource=resource;save();render();
}
function upgradeWorker(uidValue){
 const w=S.workers.find(x=>x.uid===uidValue);if(!w)return;
 if(w.level>=4)return toast("Максимальный уровень");
 const cost=300*w.level*w.level;
 if(S.tokens<1)return toast("Нужен 1 жетон");
 if(S.money<cost)return toast("Нужно "+fmt(cost)+" монет");
 S.tokens--;S.money-=cost;w.level++;
 toast("Шахтёр повышен до уровня "+w.level);save();render();
}
function rarityRoll(weights){
 let r=Math.random()*weights.reduce((a,b)=>a+b,0);
 for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return RARITIES[i]}
 return "common";
}
function openChest(id){
 const c=CHESTS.find(x=>x.id===id);if(!c)return;
 if(S.money<c.cost)return toast("Недостаточно монет");
 S.money-=c.cost;
 const pityLimit={wood:20,iron:15,gold:10,imperial:5};
 let rarity=rarityRoll(c.weights);
 if(S.pity[id]>=pityLimit[id]-1 && RARITIES.indexOf(rarity)<2)rarity="rare";
 if(rarity==="legendary"||rarity==="epic"||rarity==="rare")S.pity[id]=0;
 else S.pity[id]=(S.pity[id]||0)+1;
 const options=WORKERS.filter(w=>w.rarity===rarity);
 const def=options[Math.floor(Math.random()*options.length)]||WORKERS[0];
 const existing=S.workers.find(w=>w.id===def.id);
 let result;
 if(existing){
  const tokens={common:1,uncommon:2,rare:3,epic:5,legendary:8}[rarity];
  S.tokens+=tokens;result="Дубликат! Получено жетонов: "+tokens;
 }else{
  S.workers.push({uid:uid(),id:def.id,level:1,mine:S.currentMine,resource:MINES[S.currentMine].ores[0]});
  result="Новый шахтёр: "+def.name;
 }
 S.collections[def.id]=true;addXP(20);
 toast(RUS[rarity]+": "+result);save();render();
}
function buyBuilding(id){
 const b=BUILDINGS.find(x=>x.id===id);if(!b)return;
 const lvl=S.buildings[id]||0,cost=Math.floor(b.base*Math.pow(1.75,lvl));
 if(S.money<cost)return toast("Недостаточно монет");
 S.money-=cost;S.buildings[id]=lvl+1;addXP(25);
 toast(b.name+" улучшено");save();render();
}
function buyGear(id){
 const g=GEAR.find(x=>x.id===id);if(!g)return;
 if(S.gear.includes(id))return toast("Уже куплено");
 if(S.money<g.cost)return toast("Недостаточно монет");
 S.money-=g.cost;S.gear.push(id);
 if(!S.equipment[g.slot])S.equipment[g.slot]=id;
 save();render();
}
function equip(id){
 const g=GEAR.find(x=>x.id===id);if(!g||!S.gear.includes(id))return;
 S.equipment[g.slot]=id;toast("Экипировка установлена");save();render();
}
function sendTrain(routeId){
 const r=ROUTES.find(x=>x.id===routeId);if(!r)return;
 if(S.buildings.station<1)return toast("Сначала постройте станцию");
 if(!S.mines.includes(r.unlock))return toast("Сначала откройте нужную шахту");
 if(S.trains.some(t=>t.route===routeId))return toast("Этот поезд уже в пути");
 const cargo={};
 let total=0;
 for(const id of MINES[r.unlock].ores){
  const amount=Math.min(S.ores[id],Math.floor(5+S.level*2));
  if(amount>0){cargo[id]=amount;S.ores[id]-=amount;total+=amount*ORES[id].price}
 }
 if(total<100)return toast("Нужно больше руды для отправки");
 S.trains.push({id:uid(),route:routeId,finish:now()+r.time*1000,value:Math.floor(total*r.mult),cargo});
 toast("Поезд отправлен!");save();render();
}
function collectTrain(id){
 const t=S.trains.find(x=>x.id===id);if(!t||now()<t.finish)return;
 S.money+=t.value;S.rep+=Math.floor(t.value/500);S.stats.trains++;
 S.trains=S.trains.filter(x=>x.id!==id);addXP(35);
 toast("Поезд прибыл! Получено "+fmt(t.value));save();render();
}
function sendExpedition(){
 if(S.workers.length<2)return toast("Нужно минимум 2 шахтёра");
 if(S.expeditions.length>=2)return toast("Все экспедиционные места заняты");
 const cost=500+S.expeditions.length*500;
 if(S.money<cost)return toast("Нужно "+cost+" монет");
 S.money-=cost;
 const team=S.workers.slice(0,Math.min(3,S.workers.length));
 const power=team.reduce((a,w)=>a+workerRate(w),0);
 const duration=90000;
 S.expeditions.push({id:uid(),finish:now()+duration,power,reward:Math.floor(500+power*500+S.level*80)});
 toast("Экспедиция отправлена");save();render();
}
function collectExpedition(id){
 const e=S.expeditions.find(x=>x.id===id);if(!e||now()<e.finish)return;
 const reward=e.reward;
 S.money+=reward;S.rep+=5;S.stats.expeditions++;
 if(Math.random()<.35)addOre(randomOre(S.currentMine),3);
 if(Math.random()<.08)S.tokens++;
 S.expeditions=S.expeditions.filter(x=>x.id!==id);
 addXP(60);toast("Экспедиция вернулась с наградой");save();render();
}
function createContract(){
 if(S.contracts.length>=3)return toast("Слишком много активных заказов");
 const available=MINES[S.currentMine].ores;
 const ore=available[Math.floor(Math.random()*available.length)];
 const amount=10+Math.floor(Math.random()*30);
 S.contracts.push({id:uid(),ore,amount,reward:Math.floor(amount*ORES[ore].price*1.8+150),expires:now()+3600000});
 save();render();
}
function completeContract(id){
 const c=S.contracts.find(x=>x.id===id);if(!c)return;
 if(S.ores[c.ore]<c.amount)return toast("Недостаточно руды");
 S.ores[c.ore]-=c.amount;
 const bonus=1+S.buildings.bank*.1;
 S.money+=Math.floor(c.reward*bonus);S.rep+=3;
 S.contracts=S.contracts.filter(x=>x.id!==id);
 addXP(30);S.stats.sold+=c.amount;
 toast("Контракт выполнен");save();render();
}
function dailyReward(){
 const day=86400000;
 if(now()-S.lastDaily<day)return toast("Ежедневная награда уже получена");
 S.dailyStreak=Math.min(7,S.dailyStreak+1);
 const reward=500+S.dailyStreak*250;
 S.money+=reward;S.tokens+=S.dailyStreak%3===0?1:0;
 S.lastDaily=now();addXP(30);
 toast("Ежедневная награда: "+fmt(reward));save();render();
}
function claimQuest(id){
 const q=QUESTS.find(x=>x.id===id);if(!q||S.quests[id])return;
 const val=questValue(q.type);
 if(val<q.goal)return toast("Задание ещё не выполнено");
 S.quests[id]=true;S.money+=q.reward;S.rep+=2;addXP(35);
 toast("Задание выполнено!");save();render();
}
function questValue(type){
 switch(type){
 case "mined":return S.stats.mined;
 case "sold":return S.stats.sold;
 case "mines":return S.mines.length;
 case "workers":return S.workers.length;
 case "buildings":return Object.values(S.buildings).reduce((a,b)=>a+b,0);
 case "money":return S.money;
 case "trains":return S.stats.trains;
 case "expeditions":return S.stats.expeditions;
 default:return 0;
 }
}
function claimAchievement(id){
 if(S.achievements[id])return;
 const a=ACHIEVEMENTS.find(x=>x[0]===id);if(!a||!a[3]())return;
 S.achievements[id]=true;S.money+=1500;S.rep+=10;addXP(100);
 toast("Достижение получено!");save();render();
}
function checkContracts(){
 const before=S.contracts.length;
 S.contracts=S.contracts.filter(c=>c.expires>now());
 if(before!==S.contracts.length)save();
}
function produce(seconds){
 for(const w of S.workers){
  const def=WORKERS[w.id],mine=MINES[w.mine];
  if(!def||!mine)continue;
  const ore=mine.ores.includes(w.resource)?w.resource:mine.ores[0];
  const amount=workerRate(w)*seconds/60;
  S.ores[ore]+=amount;S.stats.mined+=amount;
 }
}
function offline(){
 const current=now();
 const elapsed=Math.max(0,Math.min(4*3600000,current-(S.lastTime||current)));
 const seconds=elapsed/1000;
 if(seconds>60&&S.workers.length){
  const gain=income()/60*seconds*.25;
  const totalRate=S.workers.reduce((a,w)=>a+workerRate(w),0);
  if(totalRate>0){
   for(const w of S.workers){
    const share=workerRate(w)/totalRate;
    S.ores[w.resource]+=gain*share;
    S.stats.mined+=gain*share;
   }
   toast("Пока вас не было, шахтёры добыли руду");
  }
 }
 S.lastTime=current;
}
function update(){
 const t=now();
 produce(1);
 for(const x of [...S.trains])if(t>=x.finish)collectTrain(x.id);
 for(const x of [...S.expeditions])if(t>=x.finish)collectExpedition(x.id);
 checkContracts();
 tickCount++;
 if(tickCount%10===0){S.lastTime=t;save();}
 if(tickCount%5===0&&tab==="mine")render();
}
function headerStats(){
 $("money").textContent=fmt(S.money)+" ₽";
 $("xp").textContent=fmt(S.xp)+"/"+fmt(xpNeed());
 $("level").textContent=S.level;
 $("tokens").textContent=fmt(S.tokens);
 $("rep").textContent=fmt(S.rep);
 $("income").textContent=income().toFixed(1)+"/мин";
}

 headerStats();
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 const root=$("content");
 if(tab==="mine")root.innerHTML=renderMine();
 if(tab==="miners")root.innerHTML=renderMiners();
 if(tab==="chests")root.innerHTML=renderChests();
 if(tab==="industry")root.innerHTML=renderIndustry();
 if(tab==="more")root.innerHTML=renderMore();
}

   const val=questValue(q.type),done=val>=q.goal;
   return `<div class="item">
    <div class="row"><b>${q.name}</b><span class="badge">${S.quests[q.id]?"Выполнено":done?"Готово":"В процессе"}</span></div>
    <div class="muted">${q.desc}</div>
    <div class="progress"><span style="width:${Math.min(100,val/q.goal*100)}%"></span></div>
    <div class="muted">${fmt(val)} / ${fmt(q.goal)} · Награда ${fmt(q.reward)} ₽</div>
    ${!S.quests[q.id]?`<button onclick="claimQuest('${q.id}')" ${!done?"disabled":""}>Забрать награду</button>`:""}
   </div>`;
  }).join("")}
 </section>
 <section class="panel">
  <h2>🏅 Достижения</h2>
  ${ACHIEVEMENTS.map(a=>`<div class="item">
   <div class="row"><b>${a[1]}</b><span class="badge">${S.achievements[a[0]]?"Получено":a[3]()?"Доступно":"Не выполнено"}</span></div>
   <div class="muted">${a[2]}</div>
   ${!S.achievements[a[0]]?`<button onclick="claimAchievement('${a[0]}')" ${!a[3]()?"disabled":""}>Получить · 1 500 ₽</button>`:""}
  </div>`).join("")}
 </section>
 <section class="panel">
  <h2>📚 Альбом коллекционера</h2>
  <div class="muted">Открыто ${Object.keys(S.collections).filter(k=>S.collections[k]).length} из ${WORKERS.length} шахтёров.</div>
  <div class="progress"><span style="width:${Object.keys(S.collections).filter(k=>S.collections[k]).length/WORKERS.length*100}%"></span></div>
  ${WORKERS.map(w=>`<div class="row item">
   <span class="${w.rarity}">${S.collections[w.id]?w.icon:"❔"} ${S.collections[w.id]?w.name:"Неизвестный шахтёр"}</span>
   <span class="badge ${w.rarity}">${S.collections[w.id]?RUS[w.rarity]:"???"}</span>
  </div>`).join("")}
 </section>
 <section class="panel">
  <h2>🎁 Ежедневная награда</h2>
  <div class="muted">Заходите каждый день и получайте всё более крупную награду. Каждые три дня — дополнительный жетон.</div>
  <div class="gold">Текущая серия: ${S.dailyStreak} дней</div>
  <button style="margin-top:8px" onclick="dailyReward()">Получить награду</button>
 </section>
 <section class="panel">
  <h2>📊 Статистика державы</h2>
  <div class="row"><span>Всего добыто</span><b>${fmt(S.stats.mined)}</b></div>
  <div class="row"><span>Всего продано</span><b>${fmt(S.stats.sold)}</b></div>
  <div class="row"><span>Поездов отправлено</span><b>${fmt(S.stats.trains)}</b></div>
  <div class="row"><span>Экспедиций завершено</span><b>${fmt(S.stats.expeditions)}</b></div>
  <div class="row"><span>Открыто шахт</span><b>${S.mines.length}/${MINES.length}</b></div>
  <div class="row"><span>Зданий построено</span><b>${Object.values(S.buildings).reduce((a,b)=>a+b,0)}</b></div>
 </section>
 <section class="panel">
  <h2>💾 Сохранение</h2>
  <div class="muted">Прогресс сохраняется в памяти браузера на этом устройстве.</div>
  <button style="margin-top:8px" onclick="save();toast('Сохранение выполнено')">Сохранить игру</button>
 </section>`;
}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-tab]");
 if(!b)return;
 tab=b.dataset.tab;render();
});
function start(){
 try{
  load();
  offline();
  const tg=window.Telegram?.WebApp;
  if(tg){tg.ready();tg.expand();}
  $("loading").style.display="none";
  $("app").style.display="block";
  render();save();
  setInterval(update,1000);
  document.addEventListener("visibilitychange",()=>{
   if(document.visibilityState==="hidden"){
    S.lastTime=now();save();
   }else{
    offline();save();render();
   }
  });
  window.addEventListener("pagehide",()=>{S.lastTime=now();save()});
 }catch(err){
  $("loadText").textContent="Не удалось загрузить игру: "+(err?.message||"неизвестная ошибка");
  console.error(err);
 }
}
start();
</script>
